[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-baby"
dynamic = ["version"]
description = "Bootstrap and score a safe repository harness for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Harness Baby contributors" }]
keywords = ["ai-agents", "cli", "developer-tools", "repository", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "twine>=6.0,<7",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
harness-baby = "harness_baby.cli:main"

[project.urls]
Repository = "https://github.com/yamashi128/Harness_Baby"
Issues = "https://github.com/yamashi128/Harness_Baby/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_baby = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "harness_baby.__version__" }

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["harness_baby"]
