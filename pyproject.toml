[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-doctor"
version = "0.1.0"
description = "Deterministic repository readiness diagnostics for coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harness Doctor contributors" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.0,<9",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
harness-doctor = "harness_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_doctor = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["harness_doctor"]
